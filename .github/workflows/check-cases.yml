name: Check Cases

# check_all.py 가 지금까지는 로컬 pre-push 훅(cpx/tools/pre-push.sample)에만 걸려 있었다.
# 그 훅은 각자 수동으로 설치해야 동작하므로, GitHub 웹 편집이나 --no-verify 로 올라간
# 변경은 아무 검사도 안 거쳤다. 여기서 같은 검사를 서버 쪽에서 한 번 더 강제한다.
on:
  push:
    branches: [main]
    paths:
      - "cpx/skills/start/refs/cases/**"
      - "cpx/tools/**"
  pull_request:
    paths:
      - "cpx/skills/start/refs/cases/**"
      - "cpx/tools/**"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 카드 전체 점검 (형식·내부 모순·조합 규칙·실사용 출력)
        working-directory: cpx/tools
        run: python check_all.py 10
